<svg xmlns="http://www.w3.org/2000/svg" width="400" height="400" viewBox="0 0 400 400" fill="none" role="img" aria-label="MoiraWeave Logo">
  <defs>
    <!-- Node Gradient (Deep Blue to Purple) -->
    <radialGradient id="nodeGrad" cx="30%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#818cf8"/>
      <stop offset="35%" stop-color="#4f46e5"/>
      <stop offset="100%" stop-color="#1e1b4b"/>
    </radialGradient>
    
    <!-- Central Node Gradient (Purple/Violet) -->
    <radialGradient id="centerNodeGrad" cx="30%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#d8b4fe"/>
      <stop offset="35%" stop-color="#a855f7"/>
      <stop offset="100%" stop-color="#4a044e"/>
    </radialGradient>

    <!-- Node Highlight/Glow -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Connection Lines (Network) -->
  <g stroke="#312e81" stroke-width="3" opacity="0.85">
    <!-- Center to Outer Connections -->
    <line x1="200" y1="200" x2="200" y2="100" />
    <line x1="200" y1="200" x2="270" y2="130" />
    <line x1="200" y1="200" x2="300" y2="200" />
    <line x1="200" y1="200" x2="270" y2="270" />
    <line x1="200" y1="200" x2="200" y2="300" />
    <line x1="200" y1="200" x2="130" y2="270" />
    <line x1="200" y1="200" x2="100" y2="200" />
    <line x1="200" y1="200" x2="130" y2="130" />
    
    <!-- Outer Connections (Octagon) -->
    <polygon points="200,100 270,130 300,200 270,270 200,300 130,270 100,200 130,130" fill="none" stroke-width="3.5" />

    <!-- Cross/Diagonal Connections -->
    <line x1="200" y1="100" x2="200" y2="300" />
    <line x1="100" y1="200" x2="300" y2="200" />
    <line x1="130" y1="130" x2="270" y2="270" />
    <line x1="130" y1="270" x2="270" y2="130" />

    <!-- Outer-to-Outer Star Connections -->
    <line x1="200" y1="100" x2="300" y2="200" />
    <line x1="300" y1="200" x2="200" y2="300" />
    <line x1="200" y1="300" x2="100" y2="200" />
    <line x1="100" y1="200" x2="200" y2="100" />
    
    <line x1="270" y1="130" x2="270" y2="270" />
    <line x1="270" y1="270" x2="130" y2="270" />
    <line x1="130" y1="270" x2="130" y2="130" />
    <line x1="130" y1="130" x2="270" y2="130" />
  </g>

  <!-- Network Nodes (Spheres) -->
  <g>
    <!-- Outer Circle Nodes -->
    <circle cx="200" cy="100" r="16" fill="url(#nodeGrad)" />
    <circle cx="270" cy="130" r="16" fill="url(#nodeGrad)" />
    <circle cx="300" cy="200" r="16" fill="url(#nodeGrad)" />
    <circle cx="270" cy="270" r="16" fill="url(#nodeGrad)" />
    <circle cx="200" cy="300" r="16" fill="url(#nodeGrad)" />
    <circle cx="130" cy="270" r="16" fill="url(#nodeGrad)" />
    <circle cx="100" cy="200" r="16" fill="url(#nodeGrad)" />
    <circle cx="130" cy="130" r="16" fill="url(#nodeGrad)" />

    <!-- Inner Central Nodes -->
    <circle cx="200" cy="160" r="14" fill="url(#centerNodeGrad)" />
    <circle cx="200" cy="240" r="14" fill="url(#centerNodeGrad)" />
    <circle cx="200" cy="200" r="18" fill="url(#centerNodeGrad)" />
  </g>

  <!-- Text: "MoiraWeave" with Sticker Outline -->
  <g filter="url(#glow)">
    <!-- Thick black outline background -->
    <text x="200" y="222" font-family="'Manrope', 'Arial Rounded MT Bold', sans-serif" font-size="52" font-weight="900" text-anchor="middle" letter-spacing="-1px"
          stroke="#070a13" stroke-width="16" stroke-linejoin="round">
      <tspan fill="#f472b6">Moira</tspan><tspan fill="#ffffff">Weave</tspan>
    </text>
    
    <!-- Thin inner black outline for sticker separation -->
    <text x="200" y="222" font-family="'Manrope', 'Arial Rounded MT Bold', sans-serif" font-size="52" font-weight="900" text-anchor="middle" letter-spacing="-1px"
          stroke="#070a13" stroke-width="6" stroke-linejoin="round">
      <tspan fill="#f472b6">Moira</tspan><tspan fill="#ffffff">Weave</tspan>
    </text>

    <!-- Foreground Text -->
    <text x="200" y="222" font-family="'Manrope', 'Arial Rounded MT Bold', sans-serif" font-size="52" font-weight="900" text-anchor="middle" letter-spacing="-1px">
      <tspan fill="#f472b6">Moira</tspan><tspan fill="#ffffff">Weave</tspan>
    </text>
  </g>
</svg>
